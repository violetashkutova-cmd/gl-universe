<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лакорни — GL Universe</title>
    <!-- Підключаємо загальний файл стилів -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Шапка сайту (Навігація) -->
    <header class="header">
        <div class="logo">🪷 GL Universe</div>
        <nav class="nav-links">
            <a href="index.html">Головна</a>
            <a href="lakorns.html" class="active">Лакорни</a>
            <a href="actresses.html">Актриси</a>
            <a href="companies.html">Компанії</a>
        </nav>
        <!-- Кнопка перемикання теми -->
        <button id="theme-toggle" class="theme-btn">☀️</button>
    </header>

    <!-- Основний контент сторінки лакорнів -->
    <main class="content-container">
        
        <!-- Верхній блок: заголовок і пошук поруч -->
        <div class="catalog-top">
            <h1>Каталог</h1>
            <!-- Поле пошуку -->
            <input type="text" id="search-input" placeholder="Пошук за назвою...">
        </div>

        <!-- Кнопки фільтрації за роками -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Всі</button>
            <button class="filter-btn" data-filter="2026">2026</button>
            <button class="filter-btn" data-filter="2025">2025</button>
            <button class="filter-btn" data-filter="2024">2024</button>
            <button class="filter-btn" data-filter="2023">2023</button>
            <button class="filter-btn" data-filter="2022">2022</button>
        </div>

        <!-- Сітка карток лакорнів -->
        <div class="cards-grid">
            
            <!-- Картка лакорну "КлерБелл" (2025 рік) -->
            <div class="card" data-year="2025">
                <a href="clairebell.html" class="card-img-container" style="display: block; height: 280px; overflow: hidden; border-radius: 12px 12px 0 0;">
                    <img src="clairebell.jpg" alt="КлерБелл" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;">
                </a>
                <div class="card-info">
                    <span class="card-year">2025</span>
                    <h3>КлерБелл / ClaireBell</h3>
                    <p class="card-company">Флагманський GL-трилер</p>
                    <a href="clairebell.html" class="card-link">Детальніше</a>
                </div>
            </div>

        </div>
    </main>
    <footer>
        <p>&copy; 2026 GL Universe</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>

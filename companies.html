<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Компанії — GL Universe</title>
    <!-- Підключаємо загальний файл стилів -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Шапка сайту (Навігація) -->
    <header class="header">
        <div class="logo">🪷 GL Universe</div>
        <nav class="nav-links">
            <a href="index.html">Головна</a>
            <a href="lakorns.html">Лакорни</a>
            <a href="actresses.html">Актриси</a>
            <a href="companies.html" class="active">Компанії</a>
        </nav>
        <!-- Кнопка перемикання теми -->
        <button id="theme-toggle" class="theme-btn">☀️</button>
    </header>

    <!-- Основний контент сторінки компаній -->
    <main class="content-container">
        
        <!-- Верхній блок: заголовок і пошук поруч -->
        <div class="catalog-top">
            <h1>Компанії та студії</h1>
            <!-- Поле пошуку за назвою -->
            <input type="text" id="search-input" placeholder="Пошук за назвою...">
        </div>

        <!-- Сітка карток компаній -->
        <div class="cards-grid">
            
            <!-- Mine Media Production -->
            <div class="card" data-name="mine-media">
                <a href="minemedia.html" class="card-img-container" style="display: block; height: 180px; overflow: hidden; border-radius: 12px 12px 0 0;">
                    <img src="mine-media.jpg" alt="Mine Media Production" style="width: 100%; height: 100%; object-fit: cover;">
                </a>
                <div class="card-info">
                    <span class="card-year">Студія-агенство</span>
                    <h3>Mine Media Production</h3>
                    <p class="card-company">Інді медіакомпанія</p>
                    <a href="minemedia.html" class="card-link">Про компанію</a>
                </div>
            </div>

        </div>
    </main>

    <!-- Футер -->
    <footer>
        <p>&copy; 2026 GL Universe</p>
    </footer>

    <!-- Підключаємо скрипт -->
    <script src="js/main.js"></script>
</body>
</html>
